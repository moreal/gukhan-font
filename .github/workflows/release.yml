name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[1-9]"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[1-9][0-9]"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write # Create the GitHub Release for this tag and upload its zip assets.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install
        run: npm ci
      - name: Install fontTools
        run: python3 -m pip install --user fonttools==4.67.0
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Date-stamped Gukhan font build. Verify SHA256SUMS.txt before installing." \
            dist/release/*
