name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[1-9]"
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[1-9][0-9]"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write # Create the GitHub Release for this tag and upload its zip assets.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install fontTools
        run: python3 -m pip install --user fonttools==4.67.0
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md << 'EOF'
          국한문은 한자는 그대로 두고, 독음을 글자 위에 그리거나 그 한자를 한글로 바꿔 그리는 글꼴입니다. 복사하면 한자입니다.

          ## 폰트 패밀리

          - **Gukhanmun Sans**는 한자 위에 독음을 그립니다. 남한(ko-KR) 표기입니다.
          - **Gukhanmun Sans KP**는 같은 독음 글꼴의 북한(ko-KP) 판입니다. 두음 법칙을 적용하지 않습니다.
          - **Gukhanmun Hangul**은 한자 자리에 한글을 그립니다.
          - **Gukhanmun Hangul KP**는 그 한글 글꼴의 북한 판입니다.

          패밀리마다 zip이 하나 있습니다. 안에는 정적 일곱 굵기(OTF, WOFF2), 가변 폰트(TTF, WOFF2), 웹 서브셋, 한자 애드온, `hanja.css`, `SHA256SUMS.txt`가 들어 있습니다. 같은 글꼴 파일은 릴리스에 개별로도 첨부했습니다.

          ## 특징

          - 독음은 OpenType `rclt`로 붙습니다.
          - `ss01`은 독음을 끄고 한자만 남깁니다. Hangul 패밀리에는 없습니다.
          - 남한 독음과 북한 독음이 따로 있습니다.
          - 가변 폰트의 굵기는 250에서 900까지입니다. 한자와 독음이 함께 굵어집니다.

          ## 보기

          - 본문: https://moreal.github.io/gukhanmun-font/
          - 놀이터: https://moreal.github.io/gukhanmun-font/playground/

          ## 출처

          윤곽은 Adobe Source Han Sans KR입니다. 글꼴 컴파일은 Anthony Fu의 furifont입니다. 남한 단어 표는 dahlia의 선비에서 왔고, 북한 단어 표는 dahlia의 gukhanmun이 2026-06-03에 우리말샘에서 뽑은 것입니다. gukhanmun은 국한문혼용을 한글 문자열로 바꾸는 라이브러리이고, 이 글꼴과 다른 프로젝트입니다.

          ## 라이선스

          글꼴은 SIL OFL 1.1입니다. 예약된 이름 Source는 이 글꼴의 이름이 아닙니다. 저장소 코드는 MIT입니다. 설치 전에 `SHA256SUMS.txt`로 확인하세요.
          EOF
          shopt -s nullglob
          assets=(dist/release/* dist/*.otf dist/*.ttf dist/*.woff2)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "국한문 ${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            "${assets[@]}"
