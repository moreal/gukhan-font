<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>시안 A. 조판 — 국한문</title>
  <meta name="description" content="스크롤하면 독음이 한자 위에 앉고, 音樂이 음악으로 묶이며, 굵기가 따라갑니다.">
  <link rel="preload" href="/gukhanmun-font/fonts/GukhanmunSans-Web.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/gukhanmun-font/fonts/GukhanmunSansVF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/gukhanmun-font/fonts/GothicA1-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Gukhanmun Sans Web";
      src: url("/gukhanmun-font/fonts/GukhanmunSans-Web.woff2") format("woff2");
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: "Gukhanmun Sans VF";
      src: url("/gukhanmun-font/fonts/GukhanmunSansVF.woff2") format("woff2");
      font-weight: 250 900;
      font-display: block;
    }
    @font-face {
      font-family: "Gothic A1";
      src: url("/gukhanmun-font/fonts/GothicA1-Regular.woff2") format("woff2");
      font-weight: 400;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      --paper: #f6f3ec;
      --ink: #1b1916;
      --muted: #5c564e;
      --line: rgba(27, 25, 22, 0.14);
      --cinnabar: #8c2f2b;
      --bar: 3.25rem;
      --type: clamp(2.45rem, 11vw, 7.25rem);
      /* Fraction of the line box that holds the reading, above the Hanja ink. */
      --band: 0.38;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(to right, rgba(27, 25, 22, 0.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(27, 25, 22, 0.045) 1px, transparent 1px),
        var(--paper);
      background-size: 3.5rem 3.5rem;
      font-family: "Gothic A1", sans-serif;
      font-size: 1rem;
      line-height: 1.55;
      overflow-x: clip;
    }
    a { color: inherit; }
    .top {
      position: fixed;
      z-index: 5;
      inset: 0 0 auto 0;
      height: var(--bar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0 1.1rem;
      background: color-mix(in srgb, var(--paper) 88%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .brand { text-decoration: none; letter-spacing: 0.18em; font-size: 0.92rem; }
    .top nav { display: flex; gap: 0.9rem; }
    .top nav a { text-decoration: none; font-size: 0.86rem; color: var(--muted); }
    .top nav a[aria-current="page"] { color: var(--cinnabar); }
    .act { height: 190vh; view-timeline-axis: block; }
    #open { view-timeline-name: --open; }
    #liga { view-timeline-name: --liga; }
    #axis { view-timeline-name: --axis; }
    .pin {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: calc(var(--bar) + 1.25rem) 1.25rem 2.25rem;
      text-align: center;
    }
    .step {
      margin: 0 0 0.55rem;
      color: var(--cinnabar);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
    }
    .specimen {
      position: relative;
      font-size: var(--type);
      line-height: 2;
    }
    .face, .axis {
      margin: 0;
      font-weight: 400;
      font-size: 1em;
      line-height: 2;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .hanja, .reading, .split, .joined {
      font-family: "Gukhanmun Sans Web", sans-serif;
    }
    .hanja { font-feature-settings: "ss01" 1; }
    .window {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: calc(var(--band) * 100%);
      overflow: clip;
      pointer-events: none;
    }
    .band {
      height: calc(100% / var(--band));
      clip-path: inset(0 0 calc((1 - var(--band)) * 100%) 0);
      opacity: 0;
      transform: translateY(-48%);
      animation: descend linear both;
      animation-timeline: --open;
      animation-range: entry 100% exit 0%;
    }
    .reading { font-feature-settings: "ss01" 0; }
    .cap {
      position: relative;
      width: min(26rem, 100%);
      min-height: 4.8em;
      margin: 0.85rem 0 0;
      color: var(--muted);
      font-size: 0.98rem;
    }
    .cap span { display: block; }
    .cap .on { position: absolute; inset: 0 auto auto 0; width: 100%; opacity: 0; }
    #open .off {
      animation: cap-off linear both;
      animation-timeline: --open;
      animation-range: entry 100% exit 0%;
    }
    #open .on {
      animation: cap-on linear both;
      animation-timeline: --open;
      animation-range: entry 100% exit 0%;
    }
    .meet {
      display: grid;
      place-items: center;
      font-size: var(--type);
      overflow: clip;
    }
    .split, .joined { grid-area: 1 / 1; }
    .split {
      display: flex;
      justify-content: center;
      animation: split-out linear both;
      animation-timeline: --liga;
      animation-range: entry 100% exit 0%;
    }
    .split span {
      display: block;
      animation: approach linear both;
      animation-timeline: --liga;
      animation-range: entry 100% exit 0%;
    }
    .split span:first-child { --from: -0.72em; }
    .split span:last-child { --from: 0.72em; }
    .joined {
      opacity: 0;
      animation: join-in linear both;
      animation-timeline: --liga;
      animation-range: entry 100% exit 0%;
    }
    #liga .off {
      animation: cap-off-late linear both;
      animation-timeline: --liga;
      animation-range: entry 100% exit 0%;
    }
    #liga .on {
      animation: cap-on-late linear both;
      animation-timeline: --liga;
      animation-range: entry 100% exit 0%;
    }
    .axis-slot {
      display: grid;
      place-items: center;
      width: 4.6em;
      height: 2em;
      font-size: var(--type);
    }
    .axis {
      font-family: "Gukhanmun Sans VF", sans-serif;
      font-weight: 250;
      animation: weigh linear both;
      animation-timeline: --axis;
      animation-range: entry 100% exit 0%;
    }
    #axis .on { opacity: 1; }
    .axis-out {
      margin: 0.55rem 0 0;
      min-width: 4ch;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.14em;
      color: var(--cinnabar);
    }
    .colophon { padding: 12vh 1.25rem 18vh; text-align: center; }
    .colophon a { color: var(--cinnabar); }
    .face, .axis { visibility: hidden; }
    html.ready .face, html.ready .axis { visibility: visible; }
    @keyframes descend {
      0% { transform: translateY(-48%); opacity: 0; }
      18% { transform: translateY(-36%); opacity: 0; }
      34% { transform: translateY(-14%); opacity: 0.72; }
      48% { transform: translateY(-3%); opacity: 1; }
      58%, 100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes cap-off {
      0%, 30% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes cap-on {
      0%, 32% { opacity: 0; }
      52%, 100% { opacity: 1; }
    }
    @keyframes approach {
      0% { transform: translateX(var(--from)); }
      14% { transform: translateX(calc(var(--from) * 0.86)); }
      32% { transform: translateX(calc(var(--from) * 0.46)); }
      48% { transform: translateX(calc(var(--from) * 0.12)); }
      58%, 100% { transform: translateX(0); }
    }
    @keyframes split-out {
      0%, 64% { opacity: 1; }
      80%, 100% { opacity: 0; }
    }
    @keyframes join-in {
      0%, 64% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }
    @keyframes cap-off-late {
      0%, 64% { opacity: 1; }
      80%, 100% { opacity: 0; }
    }
    @keyframes cap-on-late {
      0%, 64% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }
    @keyframes weigh {
      0% { font-weight: 250; }
      18% { font-weight: 330; }
      42% { font-weight: 490; }
      68% { font-weight: 700; }
      86% { font-weight: 830; }
      100% { font-weight: 900; }
    }
    @media (max-width: 720px) {
      .top nav { gap: 0.65rem; }
      .cap { font-size: 0.92rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .band, .split, .split span, .joined, .axis, .cap span { animation: none; }
      .band { opacity: 1; transform: none; }
      .split, #open .off, #liga .off { opacity: 0; }
      .joined, #open .on, #liga .on { opacity: 1; }
      .axis { font-weight: 560; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/gukhanmun-font/">국한문</a>
    <nav aria-label="시안">
      <a href="/gukhanmun-font/drafts/a/" aria-current="page">조판</a>
      <a href="/gukhanmun-font/drafts/b/">견본</a>
      <a href="/gukhanmun-font/drafts/c/">시험</a>
    </nav>
  </header>
  <h1 class="visually-hidden">조판. 스크롤하면 독음이 한자 위에 앉습니다.</h1>

  <section class="act" id="open">
    <div class="pin">
      <p class="step">01 · 독음</p>
      <div class="specimen">
        <p class="face hanja">國漢文混用</p>
        <div class="window" aria-hidden="true">
          <div class="band">
            <p class="face reading">國漢文混用</p>
          </div>
        </div>
      </div>
      <p class="cap">
        <span class="off">한자만 보입니다. 스타일 세트 ss01이 독음을 끄고 있습니다.</span>
        <span class="on">같은 글꼴이 독음을 글자 안에 그립니다. 덧붙인 주석이 아닙니다.</span>
      </p>
    </div>
  </section>

  <section class="act" id="liga">
    <div class="pin">
      <p class="step">02 · 합자</p>
      <div class="meet">
        <p class="split face"><span>音</span><span>樂</span></p>
        <p class="joined face">音樂</p>
      </div>
      <p class="cap">
        <span class="off">떨어져 있으면 음, 낙입니다. 樂이 어두라 두음이 바뀝니다.</span>
        <span class="on">붙으면 합자 하나입니다. 音樂의 독음은 음악입니다.</span>
      </p>
    </div>
  </section>

  <section class="act" id="axis">
    <div class="pin">
      <p class="step">03 · 굵기</p>
      <div class="axis-slot">
        <p class="axis">音樂</p>
      </div>
      <p class="axis-out" id="wght">250</p>
      <p class="cap"><span class="on">가변 폰트입니다. 한자와 독음의 획이 같은 굵기를 탑니다.</span></p>
    </div>
  </section>

  <footer class="colophon">
    <p>Gukhanmun Sans · <a href="/gukhanmun-font/">본문으로</a></p>
  </footer>
  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
  <script>
    (function () {
      var axis = document.querySelector('.axis')
      var out = document.getElementById('wght')
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      function show() {
        document.documentElement.classList.add('ready')
      }
      Promise.all([
        document.fonts.load('400 64px "Gukhanmun Sans Web"'),
        document.fonts.load('250 64px "Gukhanmun Sans VF"'),
        document.fonts.load('900 64px "Gukhanmun Sans VF"')
      ]).then(show, show)
      if (!axis || !out) return
      if (reduce) {
        out.textContent = '560'
        return
      }
      function tick() {
        var weight = Math.round(parseFloat(getComputedStyle(axis).fontWeight))
        if (weight) out.textContent = String(weight)
        requestAnimationFrame(tick)
      }
      tick()
    })()
  </script>
</body>
</html>
